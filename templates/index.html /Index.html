<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: #f3f4f6; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: #4f46e5; color: #fff; padding: 14px 18px;
      font-weight: 600; font-size: 18px;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 80%; padding: 10px 14px; border-radius: 14px;
      line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
    }
    .user { align-self: flex-end; background: #4f46e5; color: #fff; }
    .bot { align-self: flex-start; background: #fff; color: #111; }
    form {
      display: flex; gap: 8px; padding: 12px; background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    input {
      flex: 1; padding: 12px; border: 1px solid #d1d5db;
      border-radius: 10px; font-size: 16px;
    }
    button {
      padding: 12px 18px; border: 0; border-radius: 10px;
      background: #4f46e5; color: #fff; font-size: 16px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <header>🤖 AI Chat</header>
  <div id="chat">
    <div class="msg bot">Salom! Savolingizni yozing.</div>
  </div>
  <form id="form">
    <input id="input" placeholder="Savol yozing..." autocomplete="off" required />
    <button id="send">Yuborish</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      history.push({ role: "user", content: text });
      input.value = "";
      send.disabled = true;
      const loading = addMessage("Yozmoqda...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (data.answer) {
          loading.textContent = data.answer;
          history.push({ role: "assistant", content: data.answer });
        } else {
          loading.textContent = data.error || "Xatolik yuz berdi";
          history.pop();
        }
      } catch (err) {
        loading.textContent = "Serverga ulanib bo'lmadi";
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
